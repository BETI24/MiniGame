<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Neon Mega Slot 5x5</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

        :root {
            --bg-color: #05050a;
            --neon-pink: #ff007f;
            --neon-cyan: #00f0ff;
            --neon-gold: #ffd700;
            --neon-purple: #9d00ff;
        }

        body {
            background-color: var(--bg-color);
            color: #ffffff;
            font-family: 'Orbitron', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            min-height: 100vh;
        }

        h1 {
            color: var(--neon-gold);
            text-shadow: 0 0 10px var(--neon-gold), 0 0 25px rgba(255, 215, 0, 0.6);
            margin-bottom: 5px;
            font-size: 2.2rem;
            text-align: center;
        }

        .dashboard {
            display: flex;
            gap: 30px;
            background: rgba(20, 20, 35, 0.9);
            border: 2px solid var(--neon-cyan);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
            padding: 12px 30px;
            border-radius: 12px;
            margin-bottom: 15px;
            font-size: 1.2rem;
        }

        .stat span {
            color: var(--neon-gold);
            font-weight: 700;
        }

        .card-machine {
            background: linear-gradient(135deg, #121224 0%, #080812 100%);
            border: 3px solid var(--neon-pink);
            box-shadow: 0 0 30px rgba(255, 0, 127, 0.4);
            border-radius: 16px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* 5x5 Slot-Fenster */
        .slot-window {
            background: #000;
            border: 3px solid var(--neon-cyan);
            box-shadow: inset 0 0 25px rgba(0, 240, 255, 0.5);
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 20px;
            display: flex;
            gap: 8px;
            overflow: hidden;
            position: relative;
            width: 415px;
            height: 415px;
        }

        .reel-column {
            position: relative;
            width: 75px;
            height: 100%;
            overflow: hidden;
        }

        .reel-strip {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .reel-symbol {
            font-size: 2.5rem;
            width: 75px;
            height: 75px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111;
            border: 1px solid #222;
            border-radius: 6px;
            text-shadow: 0 0 10px #fff;
            box-sizing: border-box;
            flex-shrink: 0;
        }

        .bet-controls {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            align-items: center;
        }

        .bet-btn {
            background: #222;
            color: var(--neon-cyan);
            border: 1px solid var(--neon-cyan);
            padding: 8px 18px;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }

        .bet-btn:hover {
            background: var(--neon-cyan);
            color: #000;
            box-shadow: 0 0 10px var(--neon-cyan);
        }

        .spin-btn {
            background: linear-gradient(45deg, var(--neon-pink), var(--neon-purple));
            color: white;
            border: none;
            padding: 16px 60px;
            font-size: 1.5rem;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 25px var(--neon-pink);
            transition: all 0.1s ease;
            text-transform: uppercase;
            width: 100%;
        }

        .spin-btn:hover:not(:disabled) {
            transform: scale(1.03);
            box-shadow: 0 0 35px var(--neon-pink);
        }

        .spin-btn:active:not(:disabled) {
            transform: scale(0.97);
        }

        .spin-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        @keyframes screenShake {
            0% { transform: translate(0, 0) rotate(0deg); }
            20% { transform: translate(-5px, 5px) rotate(-0.5deg); }
            40% { transform: translate(5px, -5px) rotate(0.5deg); }
            60% { transform: translate(-3px, -3px) rotate(-0.3deg); }
            80% { transform: translate(3px, 3px) rotate(0.3deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }

        .shake {
            animation: screenShake 0.4s ease;
        }

        @keyframes machineWin {
            0% { border-color: var(--neon-pink); box-shadow: 0 0 30px rgba(255,0,127,0.4); }
            50% { border-color: var(--neon-gold); box-shadow: 0 0 70px var(--neon-gold); }
            100% { border-color: var(--neon-pink); box-shadow: 0 0 30px rgba(255,0,127,0.4); }
        }

        .win-glow {
            animation: machineWin 0.6s ease infinite;
        }

        .confetti {
            position: fixed;
            width: 12px;
            height: 12px;
            background-color: var(--neon-gold);
            top: -20px;
            z-index: 999;
            pointer-events: none;
            animation: fall linear forwards;
        }

        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg) scale(1); opacity: 1; }
            100% { transform: translateY(105vh) rotate(720deg) scale(0.5); opacity: 0; }
        }

        .floating-text {
            position: absolute;
            font-size: 2.8rem;
            font-weight: 900;
            color: var(--neon-gold);
            text-shadow: 0 0 20px var(--neon-gold), 0 0 40px var(--neon-pink);
            pointer-events: none;
            z-index: 100;
            animation: floatUp 1.2s cubic-bezier(0.1, 1, 0.1, 1) forwards;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translate(-50%, 0) scale(0.5); }
            50% { transform: translate(-50%, -70px) scale(1.2); }
            100% { opacity: 0; transform: translate(-50%, -140px) scale(1); }
        }

        .msg-box {
            height: 30px;
            margin-top: 15px;
            font-size: 1.1rem;
            color: var(--neon-cyan);
            text-align: center;
        }
    </style>
</head>
<body>

<h1>NEON MEGA SLOT 5x5</h1>

<div class="dashboard">
    <div class="stat">Guthaben: <span id="balance">2000</span> 🪙</div>
</div>

<div class="card-machine" id="machine">
    <div class="slot-window" id="slotWindow"></div>

    <div class="bet-controls">
        <button class="bet-btn" onclick="changeBet(-25)">-25</button>
        <div>Einsatz: <span id="current-bet" style="color:var(--neon-gold); font-weight:bold;">25</span> 🪙</div>
        <button class="bet-btn" onclick="changeBet(25)">+25</button>
    </div>

    <button class="spin-btn" id="spinBtn" onclick="spin()">SPIN</button>
    <div class="msg-box" id="message">Viel Glück!</div>
</div>

<script>
    let balance = 2000;
    let bet = 25;
    let isSpinning = false;

    const symbols = ['🍒', '🍋', '🔔', '💎', '🔥', '7️⃣'];
    const weights = [35, 30, 20, 10, 4, 1];

    function getRandomSymbol() {
        let totalWeight = weights.reduce((a, b) => a + b, 0);
        let randomNum = Math.random() * totalWeight;
        let currentWeight = 0;

        for (let i = 0; i < symbols.length; i++) {
            currentWeight += weights[i];
            if (randomNum <= currentWeight) return symbols[i];
        }
        return symbols[0];
    }

    function initReels() {
        const slotWindow = document.getElementById('slotWindow');
        slotWindow.innerHTML = '';
        for (let c = 0; c < 5; c++) {
            let colDiv = document.createElement('div');
            colDiv.className = 'reel-column';

            let stripDiv = document.createElement('div');
            stripDiv.className = 'reel-strip';
            stripDiv.id = `strip-${c}`;

            for (let r = 0; r < 5; r++) {
                let symDiv = document.createElement('div');
                symDiv.className = 'reel-symbol';
                symDiv.innerText = getRandomSymbol();
                stripDiv.appendChild(symDiv);
            }
            colDiv.appendChild(stripDiv);
            slotWindow.appendChild(colDiv);
        }
    }

    function changeBet(amount) {
        if (isSpinning) return;
        bet += amount;
        if (bet < 25) bet = 25;
        if (bet > balance) bet = balance > 0 ? balance : 25;
        document.getElementById('current-bet').innerText = bet;
    }

    function triggerConfetti() {
        for (let i = 0; i < 70; i++) {
            let confetti = document.createElement('div');
            confetti.className = 'confetti';
            confetti.style.left = Math.random() * 100 + 'vw';
            confetti.style.backgroundColor = ['#ffd700', '#ff007f', '#00f0ff', '#9d00ff', '#ffffff'][Math.floor(Math.random() * 5)];
            confetti.style.animationDuration = (Math.random() * 1.5 + 1) + 's';
            confetti.style.animationDelay = (Math.random() * 0.3) + 's';
            document.body.appendChild(confetti);
            setTimeout(() => confetti.remove(), 2500);
        }
    }

    function showFloatingText(text) {
        let machine = document.getElementById('machine');
        let rect = machine.getBoundingClientRect();
        let el = document.createElement('div');
        el.className = 'floating-text';
        el.innerText = text;
        el.style.left = (rect.left + rect.width / 2) + 'px';
        el.style.top = (rect.top + rect.height / 2 - 40) + 'px';
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 1200);
    }

    function spin() {
        if (isSpinning) return;
        if (balance < bet) {
            document.getElementById('message').innerText = "Nicht genügend Guthaben!";
            return;
        }

        balance -= bet;
        updateDisplay();
        isSpinning = true;

        let btn = document.getElementById('spinBtn');
        let machine = document.getElementById('machine');
        btn.disabled = true;
        machine.classList.remove('win-glow');
        document.getElementById('message').innerText = "Die Walzen sausen nach unten...";

        let finalGrid = [];
        for (let r = 0; r < 5; r++) {
            let row = [];
            for (let c = 0; c < 5; c++) {
                row.push(getRandomSymbol());
            }
            finalGrid.push(row);
        }

        let stoppedCols = 0;

        for (let c = 0; c < 5; c++) {
            let strip = document.getElementById(`strip-${c}`);

            let stripSymbols = [];
            for (let k = 0; k < 20 + (c * 5); k++) {
                stripSymbols.push(getRandomSymbol());
            }
            for (let r = 0; r < 5; r++) {
                stripSymbols.push(finalGrid[r][c]);
            }

            strip.innerHTML = '';
            stripSymbols.forEach(sym => {
                let sDiv = document.createElement('div');
                sDiv.className = 'reel-symbol';
                sDiv.innerText = sym;
                strip.appendChild(sDiv);
            });

            strip.style.transition = 'none';
            strip.style.transform = 'translateY(0px)';

            let targetY = -((stripSymbols.length - 5) * 83);

            setTimeout(() => {
                let duration = 0.8 + (c * 0.25);
                strip.style.transition = `transform ${duration}s cubic-bezier(0.15, 0.85, 0.35, 1.0)`;
                strip.style.transform = `translateY(${targetY}px)`;

                setTimeout(() => {
                    stoppedCols++;
                    if (stoppedCols === 5) {
                        evaluateWins(finalGrid, machine, btn);
                        isSpinning = false;
                    }
                }, duration * 1000);

            }, 50 * c);
        }
    }

    function evaluateWins(grid, machine, btn) {
        let totalWin = 0;
        let msg = document.getElementById('message');

        for (let r = 0; r < 5; r++) {
            let firstSym = grid[r][0];
            let count = 1;
            for (let c = 1; c < 5; c++) {
                if (grid[r][c] === firstSym) {
                    count++;
                } else {
                    break;
                }
            }

            if (count >= 3) {
                let baseMultiplier = firstSym === '7️⃣' ? 40 : (firstSym === '🔥' ? 25 : (firstSym === '💎' ? 15 : (firstSym === '🔔' ? 8 : 4));
                let lengthMultiplier = count === 5 ? 5 : (count === 4 ? 2.5 : 1);
                totalWin += Math.floor(bet * baseMultiplier * lengthMultiplier);
            }
        }

        if (totalWin > 0) {
            balance += totalWin;
            msg.innerText = `MEGA GEWINN! +${totalWin} 🪙`;
            machine.classList.add('win-glow');
            machine.classList.add('shake');
            setTimeout(() => machine.classList.remove('shake'), 400);

            triggerConfetti();
            showFloatingText(`+${totalWin} 🪙`);
        } else {
            msg.innerText = "Leider kein Treffer. Nochmal drehen!";
        }

        updateDisplay();
        btn.disabled = false;
    }

    function updateDisplay() {
        document.getElementById('balance').innerText = balance;
        document.getElementById('current-bet').innerText = bet;
    }

    // Starten
    initReels();
</script>
</body>
</html>
