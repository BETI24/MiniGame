<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chain Pop - Minispiel</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background: #0d0d1a;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            height: 100vh;
        }

        /* Layout */
        #game-container {
            flex: 3;
            position: relative;
            cursor: crosshair;
            overflow: hidden;
            background: radial-gradient(circle, #1a1a3a 0%, #0d0d1a 100%);
        }
        #sidebar {
            flex: 1;
            background: #121224;
            border-left: 2px solid #2a2a50;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 10;
        }

        /* UI Elemente */
        .stats {
            background: #1a1a3a;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid #3a3a70;
        }
        h1 { margin-top: 0; font-size: 24px; color: #00ffcc; text-shadow: 0 0 10px rgba(0,255,204,0.5); }
        .stat-value { font-size: 22px; font-weight: bold; color: #ff0055; }

        /* Shop Upgrades */
        .upgrade-btn {
            width: 100%;
            background: #252545;
            color: white;
            border: 1px solid #00ffcc;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
            text-align: left;
        }
        .upgrade-btn:hover:not(:disabled) {
            background: #00ffcc;
            color: #0d0d1a;
            box-shadow: 0 0 15px rgba(0,255,204,0.4);
        }
        .upgrade-btn:disabled {
            opacity: 0.4;
            border-color: #555;
            cursor: not-allowed;
        }

        /* Spiel-Elemente */
        .orb {
            position: absolute;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            animation: spawn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
        }

        @keyframes spawn {
            0% { transform: translate(-50%, -50%) scale(0); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }

        /* Schockwelle bei Explosion */
        .shockwave {
            position: absolute;
            border: 3px solid #ff0055;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            animation: expand 0.5s forwards ease-out;
        }

        @keyframes expand {
            0% { width: 0px; height: 0px; opacity: 1; }
            100% { width: 300px; height: 300px; opacity: 0; }
        }

        /* Fliegende Punkte-Anzeige */
        .floating-text {
            position: absolute;
            font-weight: bold;
            font-size: 18px;
            color: #00ffcc;
            pointer-events: none;
            animation: floatUp 0.8s forwards ease-out;
            text-shadow: 0 0 5px rgba(0,0,0,0.8);
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-50px) scale(1.3); opacity: 0; }
        }

        .screen-shake {
            animation: shake 0.2s;
        }
        @keyframes shake {
            0% { transform: translate(2px, 2px); }
            25% { transform: translate(-2px, -3px); }
            50% { transform: translate(-3px, 2px); }
            75% { transform: translate(3px, -2px); }
            100% { transform: translate(0, 0); }
        }
    </style>
</head>
<body>

<div id="game-container" id="canvas-area"></div>

<div id="sidebar">
    <div>
        <h1>⚡ CHAIN POP</h1>
        <div class="stats">
            <div>Punkte:</div>
            <div id="score" class="stat-value">0</div>
        </div>
        <div class="stats">
            <div>Credits (Währung):</div>
            <div id="credits" class="stat-value" style="color: #00ffcc;">0</div>
        </div>
    </div>

    <div>
        <h3>Upgrades</h3>
        <button class="upgrade-btn" id="upg-size" onclick="buyUpgrade('size')">
            Größere Explosionen<br><span id="cost-size" style="font-size:12px; color:#ff0055;">Kosten: 10</span>
        </button>
        <button class="upgrade-btn" id="upg-spawn" onclick="buyUpgrade('spawn')">
            Mehr Orbs gleichzeitig<br><span id="cost-spawn" style="font-size:12px; color:#ff0055;">Kosten: 25</span>
        </button>
        <button class="upgrade-btn" id="upg-value" onclick="buyUpgrade('value')">
            Doppelter Ertrag<br><span id="cost-value" style="font-size:12px; color:#ff0055;">Kosten: 50</span>
        </button>
    </div>

    <div style="font-size: 11px; color: #777; text-align: center;">
        Klicke Orbs an, um Kettenreaktionen zu starten!
    </div>
</div>

<script>
    let score = 0;
    let credits = 0;
    let orbs = [];

    // Upgrade-Stufen & Kosten
    const upgrades = {
        size: { level: 1, cost: 10, mult: 1.5 },
        spawn: { level: 1, cost: 25, mult: 2 },
        value: { level: 1, cost: 50, mult: 2.2 }
    };

    const container = document.getElementById('game-container');

    // Orb Klasse
    class Orb {
        constructor(x, y) {
            this.x = x || Math.random() * (container.clientWidth - 60) + 30;
            this.y = y || Math.random() * (container.clientHeight - 60) + 30;
            this.radius = 20;
            this.color = `hsl(${Math.random() * 360}, 100%, 60%)`;
            this.element = document.createElement('div');

            this.element.className = 'orb';
            this.element.style.width = `${this.radius * 2}px`;
            this.element.style.height = `${this.radius * 2}px`;
            this.element.style.background = this.color;
            this.element.style.boxShadow = `0 0 15px ${this.color}`;
            this.element.style.left = `${this.x}px`;
            this.element.style.top = `${this.y}px`;

            this.element.onclick = (e) => {
                e.stopPropagation();
                this.pop(true);
            };

            container.appendChild(this.element);
        }

        pop(isManual = false, chainCount = 1) {
            const index = orbs.indexOf(this);
            if (index > -1) {
                orbs.splice(index, 1);
                this.element.remove();

                // Punkte berechnen
                const points = Math.floor(10 * chainCount * upgrades.value.level);
                score += points;
                credits += Math.floor(points / 2);
                updateUI();

                // Visuelle Effekte
                createShockwave(this.x, this.y, upgrades.size.level);
                createFloatingText(this.x, this.y, `+${points}`);

                if (isManual || chainCount > 2) {
                    triggerScreenShake();
                }

                // Kettenreaktion: Kollisionsprüfung mit anderen Orbs
                orbs.forEach(other => {
                    const dist = Math.hypot(this.x - other.x, this.y - other.y);
                    const triggerRadius = 80 * upgrades.size.level;
                    if (dist < triggerRadius) {
                        setTimeout(() => other.pop(false, chainCount + 1), 80);
                    }
                });

                // Sofort neuen Orb spawnen, um den Fluss aufrechtzuerhalten
                if(orbs.length < 5 + (upgrades.spawn.level * 2)) {
                    setTimeout(() => orbs.push(new Orb()), 300);
                }
            }
        }
    }

    function createShockwave(x, y, sizeMultiplier) {
        const wave = document.createElement('div');
        wave.className = 'shockwave';
        wave.style.left = `${x}px`;
        wave.style.top = `${y}px`;
        wave.style.width = `${300 * sizeMultiplier}px`;
        wave.style.height = `${300 * sizeMultiplier}px`;
        container.appendChild(wave);
        setTimeout(() => wave.remove(), 500);
    }

    function createFloatingText(x, y, text) {
        const ft = document.createElement('div');
        ft.className = 'floating-text';
        ft.style.left = `${x}px`;
        ft.style.top = `${y}px`;
        ft.innerText = text;
        container.appendChild(ft);
        setTimeout(() => ft.remove(), 800);
    }

    function triggerScreenShake() {
        container.classList.add('screen-shake');
        setTimeout(() => container.classList.remove('screen-shake'), 200);
    }

    function updateUI() {
        document.getElementById('score').innerText = score;
        document.getElementById('credits').innerText = credits;

        // Upgrade Buttons aktualisieren
        for (let key in upgrades) {
            const btn = document.getElementById(`upg-${key}`);
            const costEl = document.getElementById(`cost-${key}`);
            costEl.innerText = `Kosten: ${upgrades[key].cost}`;
            btn.disabled = credits < upgrades[key].cost;
        }
    }

    function buyUpgrade(type) {
        const upg = upgrades[type];
        if (credits >= upg.cost) {
            credits -= upg.cost;
            upg.level++;
            upg.cost = Math.floor(upg.cost * upg.mult);
            updateUI();

            // Bonus-Effekt beim Kauf
            for(let i = 0; i < 3; i++) {
                orbs.push(new Orb());
            }
        }
    }

    // Initiale Orbs generieren
    for (let i = 0; i < 8; i++) {
        orbs.push(new Orb());
    }

    // Automatischer Spawner, falls das Feld leer wird
    setInterval(() => {
        if (orbs.length < 4) {
            orbs.push(new Orb());
        }
    }, 1000);

    updateUI();
</script>
</body>
</html>
