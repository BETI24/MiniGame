<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Laser Overload</title>
  <style>
    body {
      margin: 0;
      background: #0b0b16;
      color: white;
      font-family: sans-serif;
      overflow: hidden;
      display: flex;
      height: 100vh;
    }
    canvas {
      background: #111122;
      box-shadow: 0 0 30px rgba(0, 255, 255, 0.2);
    }
    #sidebar {
      width: 320px;
      background: #18182c;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      border-left: 2px solid #2a2a4e;
      box-sizing: border-box;
      z-index: 10;
    }
    h2 { margin: 0 0 10px 0; color: #00ffff; font-size: 20px; text-transform: uppercase; }
    .btn {
      background: #ff0055;
      color: white;
      border: none;
      padding: 12px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 6px;
      transition: 0.1s;
      text-align: left;
    }
    .btn:hover { background: #ff2a75; transform: scale(1.02); }
    .btn:active { transform: scale(0.98); }
    .stat { font-size: 14px; color: #a0a0c0; }
  </style>
</head>
<body>

<canvas id="gameCanvas" width="800" height="700"></canvas>

<div id="sidebar">
  <h2>Upgrades</h2>
  <div class="stat" id="scoreDisplay">Credits: 0</div>
  <div class="stat" id="hpDisplay">Leben: 5</div>

  <button class="btn" id="btnDmg" onclick="buyUpgrade('dmg')">Laser-Power [Kosten: 15]<br><span style="font-size:11px;color:#ddd;">Mehr Schaden pro Schuss</span></button>
  <button class="btn" id="btnRate" onclick="buyUpgrade('rate')">Feuerrate [Kosten: 30]<br><span style="font-size:11px;color:#ddd;">Schieße viel schneller</span></button>
  <button class="btn" id="btnAuto" onclick="buyUpgrade('auto')">Auto-Drohne [Kosten: 100]<br><span style="font-size:11px;color:#ddd;">Ballert vollautomatisch</span></button>

  <div style="margin-top: auto; font-size: 12px; color: #666; text-align: center;">
    Steuerung: Maus bewegen = Schiff<br>Gegner dürfen nicht durch!
  </div>
</div>

<script>
  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");

  let score = 0;
  let hp = 5;
  let screenShake = 0;

  const player = {
    x: 400,
    y: 600,
    width: 30,
    height: 30,
    speed: 0.1,
    targetX: 400,
    targetY: 600,
    damage: 1,
    fireRate: 15, // Frames pro Schuss
    fireTimer: 0,
    hasAutoDrone: false,
    autoTimer: 0
  };

  let bullets = [];
  let enemies = [];
  let particles = [];
  let enemySpawnTimer = 0;
  let enemySpawnInterval = 60; // Mehr Gegner im Laufe der Zeit

  const upgrades = {
    dmg: { cost: 15, level: 1, mult: 1.5 },
    rate: { cost: 30, level: 1, mult: 1.5 },
    auto: { cost: 100, level: 0, mult: 1 }
  };

  // Mausposition tracken
  window.addEventListener("mousemove", (e) => {
    const rect = canvas.getBoundingClientRect();
    player.targetX = e.clientX - rect.left;
    player.targetY = e.clientY - rect.top;
  });

  function buyUpgrade(type) {
    let u = upgrades[type];
    if (score >= u.cost) {
      score -= u.cost;
      u.level++;
      u.cost = Math.floor(u.cost * u.mult);

      if (type === 'dmg') player.damage += 1;
      if (type === 'rate' && player.fireRate > 4) player.fireRate -= 2;
      if (type === 'auto') player.hasAutoDrone = true;

      triggerShake(5);
    }
  }

  function triggerShake(intensity) {
    screenShake = intensity;
  }

  function spawnEnemy() {
    let types = ['standard', 'standard', 'tank', 'fast'];
    let type = types[Math.floor(Math.random() * types.length)];
    let x = Math.random() * (canvas.width - 40) + 20;

    let hpVal = 2;
    let speedVal = 1.5;
    let color = '#ff3366';
    let size = 20;

    if (type === 'tank') {
      hpVal = 8;
      speedVal = 0.8;
      color = '#aa00ff';
      size = 30;
    } else if (type === 'fast') {
      hpVal = 1;
      speedVal = 3;
      color = '#ffaa00';
      size = 15;
    }

    enemies.push({ x: x, y: -30, size: size, hp: hpVal, maxHp: hpVal, speed: speedVal, color: color });
  }

  function createParticles(x, y, color) {
    for (let i = 0; i < 12; i++) {
      particles.push({
        x: x,
        y: y,
        vx: (Math.random() - 0.5) * 8,
        vy: (Math.random() - 0.5) * 8,
        life: 20,
        color: color
      });
    }
  }

  function update() {
    // Spieler geschmeidig zur Maus bewegen
    player.x += (player.targetX - player.x) * 0.2;
    player.y += (player.targetY - player.y) * 0.2;

    // Schießen
    player.fireTimer++;
    if (player.fireTimer >= player.fireRate) {
      bullets.push({ x: player.x, y: player.y - 15, vx: 0, vy: -15, length: 20 });
      player.fireTimer = 0;
    }

    // Auto-Drohne
    if (player.hasAutoDrone) {
      player.autoTimer++;
      if (player.autoTimer >= 10) {
        bullets.push({ x: player.x + (Math.random() * 40 - 20), y: player.y, vx: (Math.random() - 0.5) * 4, vy: -12, length: 15 });
        player.autoTimer = 0;
      }
    }

    // Projektile bewegen (Striche statt Punkte)
    for (let i = bullets.length - 1; i >= 0; i--) {
      let b = bullets[i];
      b.x += b.vx;
      b.y += b.vy;
      if (b.y < 0 || b.x < 0 || b.x > canvas.width) {
        bullets.splice(i, 1);
      }
    }

    // Gegner spawnen (Masse statt Speed-Erhöhung)
    enemySpawnTimer++;
    if (enemySpawnTimer >= enemySpawnInterval) {
      spawnEnemy();
      enemySpawnTimer = 0;
      if (enemySpawnInterval > 20) enemySpawnInterval -= 0.2; // Spawnt mit der Zeit immer mehr
    }

    // Gegner bewegen & Kollision
    for (let i = enemies.length - 1; i >= 0; i--) {
      let e = enemies[i];
      e.y += e.speed;

      // Wenn Gegner unten durchfliegt -> Leben abziehen
      if (e.y > canvas.height + 20) {
        enemies.splice(i, 1);
        hp--;
        triggerShake(10);
        if (hp <= 0) {
          alert("Game Over! Score: " + score);
          location.reload();
        }
        continue;
      }

      // Kollision mit Schüssen
      for (let j = bullets.length - 1; j >= 0; j--) {
        let b = bullets[j];
        let dist = Math.hypot(e.x - b.x, e.y - b.y);
        if (dist < e.size) {
          e.hp -= player.damage;
          createParticles(b.x, b.y, '#00ffff');
          bullets.splice(j, 1);

          if (e.hp <= 0) {
            createParticles(e.x, e.y, e.color);
            score += Math.floor(e.maxHp * 5);
            triggerShake(4);
            enemies.splice(i, 1);
            break;
          }
        }
      }
    }

    // Partikel aktualisieren
    for (let i = particles.length - 1; i >= 0; i--) {
      let p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.life--;
      if (p.life <= 0) particles.splice(i, 1);
    }

    if (screenShake > 0) screenShake *= 0.85;

    // UI aktualisieren
    document.getElementById("scoreDisplay").innerText = "Credits: " + score;
    document.getElementById("hpDisplay").innerText = "Leben: " + hp;
    document.getElementById("btnDmg").innerHTML = `Laser-Power [Kosten: ${upgrades.dmg.cost}]<br><span style="font-size:11px;color:#ddd;">Schaden: ${player.damage}</span>`;
    document.getElementById("btnRate").innerHTML = `Feuerrate [Kosten: ${upgrades.rate.cost}]<br><span style="font-size:11px;color:#ddd;">Level: ${upgrades.rate.level}</span>`;
    document.getElementById("btnAuto").innerHTML = `Auto-Drohne [Kosten: ${upgrades.auto.cost}]<br><span style="font-size:11px;color:#ddd;">Aktiv: ${player.hasAutoDrone ? 'Ja' : 'Nein'}</span>`;
  }

  function draw() {
    ctx.save();
    if (screenShake > 0.5) {
      let offsetX = (Math.random() - 0.5) * screenShake;
      let offsetY = (Math.random() - 0.5) * screenShake;
      ctx.translate(offsetX, offsetY);
    }

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Spieler zeichnen (Neon-Schiff)
    ctx.fillStyle = "#00ffff";
    ctx.beginPath();
    ctx.moveTo(player.x, player.y - player.height / 2);
    ctx.lineTo(player.x - player.width / 2, player.y + player.height / 2);
    ctx.lineTo(player.x + player.width / 2, player.y + player.height / 2);
    ctx.closePath();
    ctx.fill();

    // Schüsse zeichnen (Striche statt Punkte)
    ctx.strokeStyle = "#00ffff";
    ctx.lineWidth = 3;
    for (let b of bullets) {
      ctx.beginPath();
      ctx.moveTo(b.x, b.y);
      ctx.lineTo(b.x, b.y + b.length);
      ctx.stroke();
    }

    // Gegner zeichnen
    for (let e of enemies) {
      ctx.fillStyle = e.color;
      ctx.fillRect(e.x - e.size / 2, e.y - e.size / 2, e.size, e.size);

      // Lebensbalken über Gegnern
      ctx.fillStyle = "red";
      ctx.fillRect(e.x - 15, e.y - e.size / 2 - 8, 30, 4);
      ctx.fillStyle = "lime";
      ctx.fillRect(e.x - 15, e.y - e.size / 2 - 8, 30 * (e.hp / e.maxHp), 4);
    }

    // Partikel zeichnen
    for (let p of particles) {
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x, p.y, 3, 3);
    }

    ctx.restore();
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  loop();
</script>

</body>
</html>
