<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRISMA CLIX - Turbo Edition</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background: #08080c;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
        }

        #game-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            background: radial-gradient(circle, #181828 0%, #08080c 100%);
            overflow: hidden;
        }

        #sidebar {
            width: 420px;
            background: #101016;
            border-left: 2px solid #202030;
            display: flex;
            flex-direction: column;
            padding: 20px;
            z-index: 10;
            box-shadow: -10px 0 30px rgba(0,0,0,0.7);
        }

        #stats {
            position: absolute;
            top: 30px;
            text-align: center;
            z-index: 5;
        }

        #score {
            font-size: 4rem;
            font-weight: 900;
            background: linear-gradient(45deg, #00ffcc, #ff007f, #ffff00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 40px rgba(0,255,204,0.4);
            margin: 0;
            animation: pulseScore 2s infinite alternate;
        }

        @keyframes pulseScore {
            0% { transform: scale(1); }
            100% { transform: scale(1.02); }
        }

        #sps {
            font-size: 1.1rem;
            color: #a0a0c0;
            margin-top: 5px;
            font-weight: 600;
        }

        /* Der extrem animierte Klick-Button */
        #clicker-btn {
            width: 240px;
            height: 240px;
            border-radius: 50%;
            background: radial-gradient(circle, #ff007f 0%, #7f00ff 50%, #00ffff 100%);
            border: 6px solid #ffffff;
            cursor: pointer;
            box-shadow: 0 0 60px rgba(255,0,127,0.7), inset 0 0 30px rgba(255,255,255,0.6);
            transition: transform 0.08s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            outline: none;
            z-index: 5;
        }

        #clicker-btn:active {
            transform: scale(0.85) rotate(5deg);
            box-shadow: 0 0 20px rgba(255,0,127,1);
        }

        /* Schockwelle beim Klick */
        .shockwave {
            position: absolute;
            width: 240px;
            height: 240px;
            border-radius: 50%;
            border: 3px solid #00ffcc;
            pointer-events: none;
            animation: expandWave 0.5s ease-out forwards;
            z-index: 4;
        }

        @keyframes expandWave {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(2.5); opacity: 0; }
        }

        /* Partikel-System */
        .particle {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            pointer-events: none;
            animation: flyParticle 0.6s ease-out forwards;
            z-index: 100;
        }

        @keyframes flyParticle {
            0% { transform: translate(0, 0) scale(1.5); opacity: 1; }
            100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
        }

        /* Shop Tabs & Container */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .tab-btn {
            flex: 1;
            background: #181824;
            border: 1px solid #28283c;
            color: #8888a0;
            padding: 10px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: #ff007f;
            color: white;
            border-color: #ff007f;
            box-shadow: 0 0 15px rgba(255,0,127,0.4);
        }

        h2 {
            font-size: 1.1rem;
            color: #00ffcc;
            border-bottom: 2px solid #202030;
            padding-bottom: 8px;
            margin-top: 0;
        }

        .shop-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-right: 5px;
        }

        .shop-list::-webkit-scrollbar {
            width: 6px;
        }
        .shop-list::-webkit-scrollbar-thumb {
            background: #28283c;
            border-radius: 3px;
        }

        .upgrade-card {
            background: #161622;
            border: 1px solid #262638;
            border-radius: 8px;
            padding: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .upgrade-card:hover:not(.locked) {
            background: #202030;
            border-color: #00ffcc;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0,255,204,0.15);
        }

        .upgrade-card.locked {
            opacity: 0.35;
            cursor: not-allowed;
        }

        .upgrade-info h4 {
            margin: 0 0 4px 0;
            font-size: 0.95rem;
            color: #fff;
        }

        .upgrade-info p {
            margin: 0;
            font-size: 0.75rem;
            color: #8888a0;
        }

        .upgrade-cost {
            font-weight: bold;
            color: #ffd700;
            font-size: 0.9rem;
            text-align: right;
        }

        /* Floating Text Effekte */
        .floating-text {
            position: absolute;
            font-weight: 900;
            font-size: 1.4rem;
            pointer-events: none;
            animation: floatUp 0.7s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            z-index: 100;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(0.8); }
            50% { transform: translateY(-40px) scale(1.3); }
            100% { opacity: 0; transform: translateY(-90px) scale(1); }
        }

        /* Screen Shake */
        @keyframes shake {
            0% { transform: translate(2px, 2px) rotate(0deg); }
            20% { transform: translate(-4px, 1px) rotate(-1deg); }
            40% { transform: translate(2px, -3px) rotate(1deg); }
            60% { transform: translate(-2px, 3px) rotate(0deg); }
            80% { transform: translate(-4px, 2px) rotate(-1deg); }
            100% { transform: translate(1px, -2px) rotate(1deg); }
        }

        .shake {
            animation: shake 0.18s ease-in-out;
        }
    </style>
</head>
<body>

<div id="game-container" id="gameContainer">
    <div id="stats">
        <div id="score">0</div>
        <div id="sps">Prisma / Sekunde: 0.0</div>
    </div>

    <button id="clicker-btn"></button>
</div>

<div id="sidebar">
    <h2>QUANTEN-SHOP</h2>
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('auto')">Generator</button>
        <button class="tab-btn" onclick="switchTab('click')">Klick-Power</button>
    </div>
    <div class="shop-list" id="shop-container"></div>
</div>

<script>
    let game = {
        score: 0,
        totalClicks: 0,
        clickPower: 1,
        sps: 0,
        currentTab: 'auto',
        upgrades: {
            // Automatisierung (SPS)
            nanoDrone: { name: "Nano-Drohne", cost: 15, sps: 0.6, count: 0, desc: "+0.6 / Sek", type: 'auto' },
            prismLaser: { name: "Prisma-Laser", cost: 110, sps: 4.5, count: 0, desc: "+4.5 / Sek", type: 'auto' },
            quantumCore: { name: "Quanten-Kern", cost: 1200, sps: 35, count: 0, desc: "+35 / Sek", type: 'auto' },
            matrixForge: { name: "Matrix-Schmiede", cost: 13000, sps: 280, count: 0, desc: "+280 / Sek", type: 'auto' },
            hyperSingularity: { name: "Hyper-Singularität", cost: 140000, sps: 1500, count: 0, desc: "+1.5k / Sek", type: 'auto' },
            omegaReactor: { name: "Omega-Reaktor", cost: 1600000, sps: 9200, count: 0, desc: "+9.2k / Sek", type: 'auto' },

            // Aktive Klick-Upgrades (Erhöhen die Klick-Macht massiv)
            photonFinger: { name: "Photonen-Finger", cost: 50, clickBoost: 1, count: 0, desc: "+1 Prisma pro Klick", type: 'click' },
            plasmaGlove: { name: "Plasma-Handschuh", cost: 350, clickBoost: 5, count: 0, desc: "+5 Prisma pro Klick", type: 'click' },
            laserPointer: { name: "Tachyonen-Strahl", cost: 2400, clickBoost: 25, count: 0, desc: "+25 Prisma pro Klick", type: 'click' },
            novaClicker: { name: "Nova-Klicker", cost: 18000, clickBoost: 150, count: 0, desc: "+150 Prisma pro Klick", type: 'click' },
            godFinger: { name: "Götterhand-Matrix", cost: 150000, clickBoost: 800, count: 0, desc: "+800 Prisma pro Klick", type: 'click' }
        }
    };

    const scoreEl = document.getElementById('score');
    const spsEl = document.getElementById('sps');
    const clickerBtn = document.getElementById('clicker-btn');
    const shopContainer = document.getElementById('shop-container');
    const gameContainer = document.getElementById('game-container');

    function switchTab(tab) {
        game.currentTab = tab;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        event.target.classList.add('active');
        initShop();
    }

    function initShop() {
        shopContainer.innerHTML = '';
        for (let key in game.upgrades) {
            let up = game.upgrades[key];
            if (up.type !== game.currentTab) continue;

            let card = document.createElement('div');
            card.className = 'upgrade-card locked';
            card.id = `upgrade-${key}`;
            card.innerHTML = `
                    <div class="upgrade-info">
                        <h4>${up.name} (${up.count})</h4>
                        <p>${up.desc}</p>
                    </div>
                    <div class="upgrade-cost" id="cost-${key}">${Math.floor(up.cost).toLocaleString()} P</div>
                `;
            card.onclick = () => buyUpgrade(key);
            shopContainer.appendChild(card);
        }
        updateUI();
    }

    // Klick-Aktion mit massiven visuellen Effekten
    clickerBtn.addEventListener('click', (e) => {
        let gain = game.clickPower;
        let isCrit = Math.random() < 0.15; // 15% Chance auf fetten Crit

        if (isCrit) {
            gain *= 5;
            triggerScreenShake();
            createShockwave();
        }

        game.score += gain;
        game.totalClicks++;

        // Visuelle Effekte spawnen
        createFloatingText(e.clientX, e.clientY, `+${Math.floor(gain).toLocaleString()}`, isCrit ? '#ffff00' : '#00ffcc', isCrit);
        createParticleBurst(e.clientX, e.clientY);

        updateUI();
    });

    function createFloatingText(x, y, text, color, isCrit) {
        let el = document.createElement('div');
        el.className = 'floating-text';
        el.style.left = `${x - 20}px`;
        el.style.top = `${y - 20}px`;
        el.style.color = color;
        el.style.fontSize = isCrit ? '2rem' : '1.3rem';
        el.innerText = isCrit ? `${text} CRIT!` : text;
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 700);
    }

    function createParticleBurst(x, y) {
        const colors = ['#00ffcc', '#ff007f', '#ffff00', '#ffffff', '#7f00ff'];
        for (let i = 0; i < 12; i++) {
            let p = document.createElement('div');
            p.className = 'particle';
            p.style.left = `${x}px`;
            p.style.top = `${y}px`;
            p.style.background = colors[Math.floor(Math.random() * colors.length)];

            let angle = Math.random() * Math.PI * 2;
            let distance = 50 + Math.random() * 90;
            let dx = Math.cos(angle) * distance;
            let dy = Math.sin(angle) * distance;

            p.style.setProperty('--dx', `${dx}px`);
            p.style.setProperty('--dy', `${dy}px`);

            document.body.appendChild(p);
            setTimeout(() => p.remove(), 600);
        }
    }

    function createShockwave() {
        let rect = clickerBtn.getBoundingClientRect();
        let wave = document.createElement('div');
        wave.className = 'shockwave';
        wave.style.left = `${rect.left + rect.width/2 - 120}px`;
        wave.style.top = `${rect.top + rect.height/2 - 120}px`;
        gameContainer.appendChild(wave);
        setTimeout(() => wave.remove(), 500);
    }

    function triggerScreenShake() {
        gameContainer.classList.add('shake');
        setTimeout(() => gameContainer.classList.remove('shake'), 180);
    }

    function buyUpgrade(key) {
        let up = game.upgrades[key];
        if (game.score >= up.cost) {
            game.score -= up.cost;
            up.count++;
            up.cost *= 1.16; // Schneller steigende Kosten für den Suchtfaktor

            if (up.type === 'auto') {
                game.sps += up.sps;
            } else if (up.type === 'click') {
                game.clickPower += up.clickBoost;
            }

            updateUI();
            initShop();
        }
    }

    function updateUI() {
        scoreEl.innerText = Math.floor(game.score).toLocaleString();
        spsEl.innerText = `Prisma / Sekunde: ${game.sps.toFixed(1)} | Klick-Power: +${game.clickPower}`;

        for (let key in game.upgrades) {
            let up = game.upgrades[key];
            let card = document.getElementById(`upgrade-${key}`);
            if (!card) continue;

            let costEl = document.getElementById(`cost-${key}`);
            costEl.innerText = `${Math.floor(up.cost).toLocaleString()} P`;

            if (game.score >= up.cost) {
                card.classList.remove('locked');
            } else {
                card.classList.add('locked');
            }
            card.querySelector('h4').innerText = `${up.name} (${up.count})`;
        }
    }

    let lastTime = performance.now();
    function gameLoop(time) {
        let delta = (time - lastTime) / 1000;
        lastTime = time;

        if (game.sps > 0) {
            game.score += game.sps * delta;
            updateUI();
        }

        requestAnimationFrame(gameLoop);
    }

    initShop();
    requestAnimationFrame(gameLoop);
</script>
</body>
</html>
